repos:
  - repo: https://github.com/mpalmer/action-validator
    rev: v0.9.0
    hooks:
      - id: action-validator

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        exclude: ^uv\.lock$

  # ruff, shfmt and shellcheck: same versions as mise.toml, so the hooks and
  # `just fmt` / `just lint` agree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [--write, --simplify]
        # shfmt parses bash, not zsh. activate.sh is zsh behind a .sh name.
        exclude_types: [zsh]
        exclude: ^cli/claudex/activate\.sh$

  # Prebuilt binary instead of the Docker image: faster in CI, and it runs
  # where Docker does not.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x"]
        # Check the zsh files too; they carry `# shellcheck shell=bash`.
        exclude_types: []
