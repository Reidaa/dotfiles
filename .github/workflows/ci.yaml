name: CI

"on":
  push:
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.14
  PRE_COMMIT_HOME: ${{ github.workspace }}/../.cache/pre-commit

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # Unit tests: every tests/test_*.py (same command as `just test`).
  # Also on macOS: the tests run the scripts with /bin/bash, which is bash 3.2
  # there, so this catches bash 4+ syntax.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rc.zsh test needs zsh; it skips when zsh is missing. macOS ships zsh.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  # Runs `curl | bash` on clean machines: tests/e2e/run.sh pipes install.sh
  # from this commit into bash as a non-root zsh user, with no terminal.
  # Linux runs in containers. macOS has no container image, so it runs on a
  # macOS runner (Apple Silicon) with a new empty HOME; see tests/e2e/check.sh.
  # Keep the Linux images in sync with the `e2e` recipe in the justfile.
  e2e:
    name: e2e (${{ matrix.image }})
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "fedora:45", "archlinux:base"]
        include:
          - image: macos
            runner: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run bootstrap end to end
        env:
          CONTAINER_ENGINE: docker # Linux only; macOS runs on the host
          IMAGE: ${{ matrix.image }}
        run: tests/e2e/run.sh "$IMAGE"
