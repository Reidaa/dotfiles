name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shfmt
        run: sudo apt-get install -y shfmt

      - uses: taiki-e/install-action@just

      - name: Run shfmt
        run: just fmt-check
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - uses: taiki-e/install-action@just

      - name: Run ShellCheck
        run: just lint
        continue-on-error: true
